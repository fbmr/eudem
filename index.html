<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUDEM HOLDING B.V.</title>
<meta name="description" content="EUDEM HOLDING B.V.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#081527;
    --navy:#0E2340;
    --navy-mid:#1C3B63;
    --gold:#6B7280;
    --paper:#D8D9DB;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'IBM Plex Mono', monospace;
    color:var(--paper);
    background:linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 60%, var(--navy-mid) 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:2.4rem 6vw 0;
  }
  .logo{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1rem, 1.6vw, 1.25rem);
    letter-spacing:0.04em;
    color:#B7BEC9;
  }

  main{
    flex:1;
  }

  footer{
    padding:3rem 6vw 2.2rem;
    font-size:0.86rem;
  }
  .footer-inner{
    max-width:1080px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr;
    gap:2.5rem;
    border-top:1px solid rgba(255,255,255,0.09);
    padding-top:2.2rem;
  }
  footer .brand{
    font-family:'Fraunces', serif;
    color:#E7E9EE;
    font-size:1rem;
    letter-spacing:0.02em;
    margin-bottom:0.5rem;
  }
  footer .legal-label{
    font-size:0.68rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:0.4rem;
  }
  footer .legal-value{
    font-size:0.85rem;
    color:#C8D2DE;
  }
  .footer-bottom{
    max-width:1080px;
    margin:2rem auto 0;
    font-size:0.72rem;
    color:#5C6B80;
  }

  @media (max-width:820px){
    .footer-inner{ grid-template-columns:1fr; gap:1.6rem; }
  }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }
</style>
</head>
<body>

  <header>
    <div class="logo">EUDEM HOLDING</div>
  </header>

  <main></main>

  <footer>
    <div class="footer-inner">
      <div>
        <div class="brand">EUDEM HOLDING B.V.</div>
      </div>
      <div>
        <span class="legal-label">Registered address</span>
        <span class="legal-value">Spaarndammerstraat 72-3<br>1013 SZ Amsterdam<br>The Netherlands</span>
      </div>
      <div>
        <span class="legal-label">VAT no.</span>
        <span class="legal-value">NL866595661B01</span>
        <br><br>
        <span class="legal-label">Registration no. (KVK)</span>
        <span class="legal-value">93995458</span>
      </div>
    </div>
    <div class="footer-bottom">
      © <span id="year"></span> EUDEM HOLDING B.V. All rights reserved.
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
